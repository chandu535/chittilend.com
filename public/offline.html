<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<title>SriPay — No connection</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
    background: #F5F4FF; color: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Telugu", sans-serif;
  }
  .card { max-width: 22rem; text-align: center; }
  .mark {
    width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 22px;
    background: linear-gradient(135deg, #7C3AED, #EC4899);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 40px; font-weight: 700; line-height: 1;
  }
  h1 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
  p { margin: 0 0 24px; font-size: 0.9375rem; line-height: 1.5; color: #64748b; }
  .te { display: block; margin-top: 6px; }
  button {
    appearance: none; border: 0; cursor: pointer; width: 100%;
    min-height: 44px; padding: 0 20px; border-radius: 12px;
    background: #7C3AED; color: #fff; font-size: 0.9375rem; font-weight: 600;
    font-family: inherit;
  }
  button:active { transform: scale(0.98); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">S</div>
    <h1>No connection</h1>
    <p>
      SriPay needs the internet to show your loans and collections, so nothing here is out of date.
      <span class="te">ఇంటర్నెట్ కనెక్షన్ లేదు. దయచేసి మళ్ళీ ప్రయత్నించండి.</span>
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
